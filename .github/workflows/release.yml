name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: app}
      - uses: actions/checkout@v4
        with:
          repository: Next-Flip/Momentum-Firmware
          ref: e1784e7418d8b074e971983ceb6fef0f37e52ae4
          submodules: recursive
          path: momentum
      - run: make -C app check
      - run: ln -s "$GITHUB_WORKSPACE/app" momentum/applications_user/tonie_emulator
      - run: ./fbt fap_tonie_emulator
        working-directory: momentum
      - name: Package binary and corresponding source
        run: >-
          python3 app/tools/package_release.py
          --fap momentum/build/f7-firmware-C/.extapps/tonie_emulator.fap
          --output release
          --tag "${{ github.ref_name }}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/tonie_emulator.fap
            release/*-source.zip
            release/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Download tonie_emulator.fap and copy it to /ext/apps/NFC/ on your Flipper.
            Built for Momentum FAP API 87.1 with the pinned mntm-012 SDK.
            The corresponding source ZIP and SHA256SUMS are included.
            See the README for compatibility and physical-test limits.
